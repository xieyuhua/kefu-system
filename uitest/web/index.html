<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI 自动化测试平台</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 仅首屏必要样式：避免样式表加载前闪烁 */
  html, body { margin: 0; background: #f5f6fa; color: #1f2430; }
  #app { min-height: 60vh; }
</style>
</head>
<body>

<!-- ===== 顶部固定导航栏 ===== -->
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/recordings" title="UI 自动化测试平台">
      <span class="brand-mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="13" rx="2"></rect>
          <path d="M8 21h8"></path>
          <path d="M12 17v4"></path>
          <path d="M7 9h3"></path>
          <path d="M7 12.5h7"></path>
        </svg>
      </span>
      <span class="brand-name">UI 自动化测试平台</span>
    </a>

    <nav class="nav" id="nav" aria-label="主导航">
      <a class="nav-item" href="#/recordings" data-nav="recordings">录制</a>
      <a class="nav-item" href="#/runs" data-nav="runs">运行</a>
      <a class="nav-item" href="#/elements" data-nav="elements">元素库</a>
      <a class="nav-item" href="#/settings" data-nav="settings">设置</a>
    </nav>

    <!-- 健康徽章 + 内置浏览器状态（app.js 内部渲染） -->
    <div class="health" id="health">
      <span class="badge badge--pending"><i class="dot"></i>连接中…</span>
    </div>
  </div>
</header>

<!-- ===== 页面容器：全部内容由 app.js 渲染 ===== -->
<main id="app" class="app"></main>

<!-- ===== 右下角 toast 容器 ===== -->
<div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>

<script src="app.js"></script>
</body>
</html>
