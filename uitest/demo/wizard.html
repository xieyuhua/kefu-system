<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>场景 4 · 多步向导 / 表单校验（Vue 编译后）</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f5f6fa;color:#1f2430;font-size:13px}
  .page_w1z2{padding:20px;max-width:720px}
  .el-card_q8w7{background:#fff;border:1px solid #e8eaf1;border-radius:12px;padding:18px 20px}
  .el-steps{display:flex;gap:8px;margin-bottom:20px}
  .el-step{flex:1;text-align:center;color:#9aa0b0}
  .el-step__head{height:3px;background:#e8eaf1;border-radius:3px;margin-bottom:8px}
  .el-step.is-active .el-step__head{background:#4f46e5}
  .el-step.is-active{color:#4f46e5;font-weight:600}
  .el-step.is-done .el-step__head{background:#10b981}
  .pane{display:none}
  .pane.is-active{display:block}
  .el-form-item{display:flex;align-items:center;margin-bottom:14px}
  .el-form-item__label{width:90px;text-align:right;padding-right:12px;color:#4b5563;flex:0 0 auto}
  .el-form-item__content{flex:1}
  .el-input__inner,.el-select__inner{width:100%;padding:8px 10px;border:1px solid #d6d9e3;border-radius:8px;font:inherit;outline:none}
  .el-input__inner:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .el-button{font:inherit;cursor:pointer;border:1px solid #d6d9e3;background:#fff;border-radius:8px;padding:8px 16px}
  .el-button--primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
  .err-tip{color:#dc2626;font-size:12px;margin:-8px 0 12px 102px;display:none}
  .err-tip.is-show{display:block}
  .actions{margin-top:20px;display:flex;gap:10px;justify-content:flex-end}
  .summary{line-height:1.9;color:#374151}
  .summary b{color:#111827}
  .done-box{text-align:center;padding:18px 0;color:#047857}
  .done-box .big{font-size:34px;margin-bottom:6px}
</style>
</head>
<body>
<div class="page_w1z2" data-v-2f6a11>
  <div class="el-card_q8w7" data-v-2f6a11>
    <div class="el-steps">
      <div class="el-step is-active" data-step="1"><div class="el-step__head"></div>填写信息</div>
      <div class="el-step" data-step="2"><div class="el-step__head"></div>确认提交</div>
      <div class="el-step" data-step="3"><div class="el-step__head"></div>完成</div>
    </div>

    <!-- 第 1 步 -->
    <div class="pane is-active" id="pane-1">
      <div class="el-form-item">
        <label class="el-form-item__label">联系人姓名</label>
        <div class="el-form-item__content"><input class="el-input__inner" id="el-id-6600-1" placeholder="请输入姓名"></div>
      </div>
      <div class="el-form-item">
        <label class="el-form-item__label">手机号</label>
        <div class="el-form-item__content"><input class="el-input__inner" id="el-id-6600-2" placeholder="请输入手机号"></div>
      </div>
      <div class="err-tip" id="err-1">请填写手机号</div>
      <div class="el-form-item">
        <label class="el-form-item__label">企业名称</label>
        <div class="el-form-item__content"><input class="el-input__inner" id="el-id-6600-3" placeholder="请输入企业名称"></div>
      </div>
      <div class="actions"><button type="button" class="el-button el-button--primary" id="btn-next">下一步</button></div>
    </div>

    <!-- 第 2 步 -->
    <div class="pane" id="pane-2">
      <div class="summary" id="summary"></div>
      <div class="actions">
        <button type="button" class="el-button" id="btn-prev">上一步</button>
        <button type="button" class="el-button el-button--primary" id="btn-submit">提交开通</button>
      </div>
    </div>

    <!-- 第 3 步 -->
    <div class="pane" id="pane-3">
      <div class="done-box">
        <div class="big">✓</div>
        <div id="done-text">开通成功</div>
      </div>
    </div>
  </div>
</div>

<script>
  var nameEl = document.getElementById('el-id-6600-1');
  var phoneEl = document.getElementById('el-id-6600-2');
  var companyEl = document.getElementById('el-id-6600-3');
  var err1 = document.getElementById('err-1');
  var steps = Array.prototype.slice.call(document.querySelectorAll('.el-step'));

  function go(n) {
    ['pane-1', 'pane-2', 'pane-3'].forEach(function (id, i) {
      document.getElementById(id).classList.toggle('is-active', i === n - 1);
    });
    steps.forEach(function (s, i) {
      s.classList.toggle('is-active', i === n - 1);
      s.classList.toggle('is-done', i < n - 1);
    });
    if (n === 2) {
      document.getElementById('summary').innerHTML =
        '联系人：<b>' + (nameEl.value || '-') + '</b><br>' +
        '手机号：<b>' + (phoneEl.value || '-') + '</b><br>' +
        '企业名称：<b>' + (companyEl.value || '-') + '</b>';
    }
  }

  document.getElementById('btn-next').addEventListener('click', function () {
    if (!phoneEl.value.trim()) { err1.classList.add('is-show'); return; }
    err1.classList.remove('is-show');
    go(2);
  });
  document.getElementById('btn-prev').addEventListener('click', function () { go(1); });
  document.getElementById('btn-submit').addEventListener('click', function () {
    document.getElementById('done-text').textContent = '开通成功：' + (companyEl.value || '企业') + ' 已创建管理后台账号';
    go(3);
  });
</script>
</body>
</html>
